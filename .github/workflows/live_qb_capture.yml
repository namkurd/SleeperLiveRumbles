name: Capture live QB injuries

# Checks throughout every NFL game (see WHEN IT RUNS below) for a
# genuinely-LIVE corroboration of a QB-injury-backup
# situation: a backup QB recording real action while Sleeper's
# injury_status for the guy in front of him reads Out/IR/PUP AND that
# game hasn't gone final yet. See capture_live_qb_injuries.py's own
# header for the full story (this is the fix for the real Baker Mayfield/
# Jalon Daniels case, Week 3 2026 -- Sleeper's injury_status has no
# timestamp, so without this, there was no way to tell "ruled out live,
# mid-game" apart from "flipped to Out sometime after the game ended").
#
# WHEN IT RUNS: one run covers a whole game day by itself ("game-day
# mode" in capture_live_qb_injuries.py): it checks every 15 minutes while
# any game is live (every 5 while watching a QB), sleeps through gaps until
# the next kickoff, and exits when nothing is live or coming up within 6
# hours. Near GitHub's 6-hour job limit it starts its own successor.
#
# The schedule below only has to get ONE run started before kickoff.
# GitHub's scheduler routinely fires hours late or skips runs (Week 4
# 2026: no run at all during the 9:30am ET Madrid game), so it fires every
# half hour, every day, from 8am-midnight ET (12:00-04:59 UTC covers EDT and
# EST), at :07/:37 to avoid the top-of-hour rush. That also covers
# international morning games and Thursday/Saturday/holiday games. While a
# run is active, extra triggers wait behind it (one at a time) and then
# exit after a single tiny scoreboard check when nothing is live. Public
# repo, so Actions minutes are free.
on:
  schedule:
    - cron: "7,37 12-23 * * *"
    - cron: "7,37 0-4 * * *"
  workflow_dispatch: {}  # manual runs, and how a long run starts its successor

permissions:
  contents: write
  actions: write  # start a successor run (game-day mode)

# Only one run at a time, so a long game-day run just holds the next
# scheduled trigger in the queue instead of two runs racing to write
# live_qb_captures.json.
concurrency:
  group: live-qb-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # The script hands off to a successor at 330 minutes; GitHub's own
    # limit is 360.
    timeout-minutes: 350
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Watch pausing needs each QB's last-seen stat line from the previous
      # run (see capture_live_qb_injuries.py's apply_watch_state). Carried
      # in the Actions cache instead of being committed, so it never adds
      # commits or Pages deploys. The newest saved copy is restored by
      # prefix; a cache miss just means "start fresh".
      - name: Restore watch state
        uses: actions/cache/restore@v4
        with:
          path: watch_state.json
          key: qb-watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qb-watch-state-

      - name: Run capture_live_qb_injuries.py
        env:
          # Commit each capture as soon as it's made during a watch, so it
          # shows up on the page without waiting for the run to finish.
          CAPTURE_COMMIT_EACH_POLL: "1"
          # Near the time limit, start a successor run (gh workflow run).
          CAPTURE_CHAIN: "1"
          GH_TOKEN: ${{ github.token }}
        run: python capture_live_qb_injuries.py

      - name: Save watch state
        if: always() && hashFiles('watch_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: watch_state.json
          key: qb-watch-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit live_qb_captures.json if it changed
        run: |
          git add live_qb_captures.json
          if git diff --cached --quiet; then
            echo "No new live QB-injury captures -- nothing to commit."
          else
            git commit -m "Capture live QB-injury corroboration ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase --quiet || true
            git push
          fi
