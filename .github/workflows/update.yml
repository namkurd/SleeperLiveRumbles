name: Update Rumbles standings

on:
  schedule:
    - cron: "0 9 * * *"  # daily, 9am UTC -- change if you want completed weeks to finalize sooner after MNF
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run build_rumbles.py
        run: python build_rumbles.py

      - name: Commit rumbles_history.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rumbles_history.json
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit."
          else
            git commit -m "Update Rumbles standings ($(date -u +%Y-%m-%d))"
            git push
          fi
