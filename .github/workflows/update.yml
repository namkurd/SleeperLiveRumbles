name: Update Rumbles standings

on:
  # GitHub can delay or silently skip scheduled runs when it's busy (the
  # top of the hour is the worst time), and a single missed daily run used
  # to leave a finished week showing as "live" for a whole extra day (Week
  # 3, 2026: the 9:00 UTC Tuesday run never fired). So this now tries
  # several times on Tuesday morning after Monday Night Football, at
  # off-peak minutes, plus a daily backup. Extra runs are harmless: the
  # build is idempotent and only commits when the standings changed, and
  # each run is well under a minute of Actions time.
  schedule:
    # Tuesday 1:23am-10:23am ET (EDT; an hour earlier in EST), roughly hourly.
    - cron: "23 5,6,7,8,9,10,12,14 * * 2"
    # Daily backup, every day of the week.
    - cron: "41 10 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data   # two runs at once would fight over the same generated files
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run build_rumbles.py
        run: python build_rumbles.py

      - name: Run build_epa.py (EPA per play, from nflverse)
        run: python build_epa.py
        continue-on-error: true

      - name: Run build_wp_timeline.py (play-by-play win-probability timelines, from nflverse)
        run: python build_wp_timeline.py
        continue-on-error: true

      - name: Run build_wp_clips.py (short official highlights for each week's biggest plays, from the NFL's YouTube channel)
        run: python build_wp_clips.py
        timeout-minutes: 50
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API }}

      - name: Run build_seasons.py (archives each finished past season, once)
        run: python build_seasons.py
        continue-on-error: true

      - name: Commit rumbles_history.json, epa_weekly.json and wp_timeline/ if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rumbles_history.json epa_weekly.json wp_timeline seasons
          if [ -d wp_clips ]; then git add wp_clips; fi
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit."
          else
            git commit -m "Update Rumbles standings ($(date -u +%Y-%m-%d))"
            git pull --rebase -X theirs origin main
            git push
          fi
